# nginx reverse proxy for the Church 2.0 API.
# Replace api.yourchurch.org with your real API subdomain (see DEPLOY.md).

# HTTP: serve the ACME challenge and redirect everything else to HTTPS.
server {
    listen 80;
    server_name api.yourchurch.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS and proxy to the API container.
server {
    listen 443 ssl;
    http2 on;
    server_name api.yourchurch.org;

    ssl_certificate     /etc/letsencrypt/live/api.yourchurch.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourchurch.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
